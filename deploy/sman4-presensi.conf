# Nginx site untuk Sistem Presensi SMA Negeri 4 Lhokseumawe.
# Domain: smkn4.klikide.my.id -> Gunicorn 127.0.0.1:8000
# Pasang di VPS: /etc/nginx/sites-available/sman4-presensi
# Aktifkan: ln -s /etc/nginx/sites-available/sman4-presensi /etc/nginx/sites-enabled/
# Sertifikat HTTPS diurus certbot (lihat deploy/DEPLOY_SMAN4.md).

upstream presensi_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name smkn4.klikide.my.id;

    # Samakan dengan MAX_CONTENT_LENGTH Flask (6 MB) untuk upload frame kamera.
    client_max_body_size 6m;

    # Log terpisah agar mudah ditelusuri.
    access_log /var/log/nginx/sman4-presensi.access.log;
    error_log /var/log/nginx/sman4-presensi.error.log;

    location / {
        proxy_pass http://presensi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Polling kamera memakai koneksi agak lama; beri ruang timeout.
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }
}
